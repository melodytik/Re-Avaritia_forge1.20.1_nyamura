// 全局初始化脚本 —— 强制所有 Gradle 项目使用国内镜像源
// 针对 NeoForged/Forge Gradle 插件的特殊依赖解析问题

allprojects { proj ->
    // ========== 注入仓库 ==========
    repositories {
        // 阿里云 Maven 镜像（最优先，证书有效）
        maven { url = "https://maven.aliyun.com/repository/public" }
        maven { url = "https://maven.aliyun.com/repository/central" }
        maven { url = "https://maven.aliyun.com/repository/releases" }
        maven { url = "https://maven.aliyun.com/repository/gradle-plugin" }
        
        // Maven Central（阿里云已覆盖，备用）
        mavenCentral()
        
        // NeoForged/Forge 官方仓库（关键依赖 modlauncher 等）
        maven { url = "https://maven.neoforged.net/releases" }
        maven { url = "https://maven.minecraftforge.net" }
        
        // Lss233 Minecraft 镜像（证书过期，仅作最后备用）
        // maven { url = "https://lss233.littleservice.cn/repositories/minecraft/" }
        
        // JitPack
        maven { url = "https://www.jitpack.io" }
    }
    
    // ========== 强制锁定动态版本 ==========
    configurations.all { conf ->
        resolutionStrategy {
            // 锁定 typetools 动态版本 0.6.+
            force 'net.jodah:typetools:0.6.3'
            // 锁定 modlauncher 动态版本 10.0.+
            force 'cpw.mods:modlauncher:10.0.9'
            // 锁定 eventbus 动态版本
            force 'net.minecraftforge:eventbus:6.0.5'
        }
    }
}

// 覆盖 pluginManagement 仓库（settings 阶段）
settingsEvaluated { settings ->
    settings.pluginManagement {
        repositories {
            maven { url = "https://maven.aliyun.com/repository/public" }
            maven { url = "https://maven.aliyun.com/repository/central" }
            maven { url = "https://maven.aliyun.com/repository/gradle-plugin" }
            maven { url = "https://maven.neoforged.net/releases" }
            maven { url = "https://maven.minecraftforge.net" }
            mavenCentral()
            gradlePluginPortal()
        }
    }
}
