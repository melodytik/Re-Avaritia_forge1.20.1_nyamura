pluginManagement {
    repositories {
        // Aliyun Maven mirrors (primary)
        maven { url = "https://maven.aliyun.com/repository/public" }
        maven { url = "https://maven.aliyun.com/repository/central" }
        maven { url = "https://maven.aliyun.com/repository/gradle-plugin" }
        maven { url = "https://maven.aliyun.com/repository/releases" }
        // NeoForged/Forge official repos (for plugins)
        maven { url = "https://maven.neoforged.net/releases" }
        maven { url = "https://maven.minecraftforge.net" }
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'net.neoforged.moddev.legacyforge' version '2.0.131'
        id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention'
}

// Centralized dependency resolution for ALL configurations (including Forge plugin's)
dependencyResolutionManagement {
    repositories {
        // Local Maven repo (pre-downloaded Forge/NeoForged deps)
        maven { url = new File(settings.rootDir, 'local-mc-repo').toURI().toString() }
        // Aliyun Maven mirrors
        maven { url = "https://maven.aliyun.com/repository/public" }
        maven { url = "https://maven.aliyun.com/repository/central" }
        maven { url = "https://maven.aliyun.com/repository/releases" }
        mavenCentral()
        // NeoForged/Forge official repos
        maven { url = "https://maven.neoforged.net/releases" }
        maven { url = "https://maven.minecraftforge.net" }
    }
}
